    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body { font-family: 'Inter', sans-serif; line-height: 1.6; color: #1e1e1e; background-color: #fcf8f3; min-height: 100vh; display: flex; flex-direction: column; }

        .header { background: #fcf8f3; border-bottom: 1px solid #efe8de; padding: 1rem 0; position: sticky; top: 0; z-index: 1000; background: rgba(252, 248, 243, 0.95); backdrop-filter: blur(10px); }

        .back-link:hover { background: #8b6549; transform: translateY(-2px); }

        .boutique-section { padding: 4rem 0; flex: 1; }
        .section-header { text-align: center; margin-bottom: 3rem; }
        .section-tag { display: inline-block; background: #f0e6d8; color: #a67b5b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.3rem 1rem; border-radius: 50px; font-size: 0.8rem; margin-bottom: 1rem; }
        .section-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3rem); color: #1e1e1e; margin-bottom: 1rem; }
        .section-header p { color: #5a4a3a; max-width: 600px; margin: 0 auto; }

        .boutique-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .product-card { background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1); }
        .product-image { width: 100%; aspect-ratio: 4 / 5; background-size: cover; background-position: center; }
        .product-info { padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
        .product-info h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: #1e1e1e; }
        .product-description { font-size: 0.9rem; color: #5a4a3a; flex: 1; }
        .product-price { font-size: 1.5rem; font-weight: 700; color: #a67b5b; margin: 0.5rem 0 1rem; }
        .product-price small { font-size: 0.9rem; color: #8a7a6a; font-weight: 400; }
        .order-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; background: #25D366; color: #fff; padding: 0.8rem 1.5rem; border-radius: 50px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; transition: background 0.3s, transform 0.3s; }
        .order-btn:hover { background: #1eb857; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4); }

        .whatsapp-float { position: fixed; bottom: 25px; right: 25px; background-color: #25D366; color: #ffffff; border-radius: 60px; padding: 12px 20px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4); z-index: 9999; transition: all 0.3s ease; }
        .whatsapp-float:hover { background-color: #1eb857; transform: translateY(-3px); }
        .whatsapp-float svg { fill: #fff; }

        .footer { background: #1e1e1e; color: #d4c8ba; padding: 2rem 0; text-align: center; margin-top: auto; }
        .footer p { font-size: 0.9rem; }

        @media (max-width: 768px) {
            .boutique-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
            .product-info { padding: 1.2rem; }
        }
        @media (max-width: 480px) {
            .boutique-grid { grid-template-columns: 1fr; }
            .header-inner { flex-direction: column; gap: 1rem; align-items: center; }
            .whatsapp-float { padding: 15px; border-radius: 50%; }
            .whatsapp-float-text { display: none; }
        }

<body>

    <main class="boutique-section">
        <div class="container">
            <div class="section-header">
                
                <h1>Pagnes disponibles à la vente</h1>
                <p>Découvrez notre sélection de pagnes traditionnels tissés à la main. Cliquez sur "Commander" pour passer votre commande directement via WhatsApp.</p>

    <script>
        const BIN_ID = '6a9303c4da38895dfe20795f';
        const ACCESS_KEY = '$2a$10$osTNUAZ58JJqPZWQSkaPj.elcUfQSQ7P7e6EV.MyV784oQAHL1y/6';
        const WHATSAPP_NUMBER = '22656618132';

        const defaultProducts = [
            { name: "Pagne Terre d'Afrique", description: "Motifs géométriques traditionnels, teintures naturelles.", price: "25 000 FCFA", image: "image/Koko Dunda.jpg" },
            { name: "Collection Savane", description: "Inspiré des paysages burkinabè, tissage artisanal.", price: "30 000 FCFA", image: "image/Koko Dunda (1).jpg" }
        ];

        function displayProducts(products) {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = '';
            products.forEach(function(product) {
                const card = document.createElement('div');
                card.className = 'product-card';
                const imageDiv = document.createElement('div');
                imageDiv.className = 'product-image';
                imageDiv.style.backgroundImage = "url('" + product.image + "')";
                const infoDiv = document.createElement('div');
                infoDiv.className = 'product-info';
                const title = document.createElement('h3');
                title.textContent = product.name;
                const description = document.createElement('p');
                description.className = 'product-description';
                description.textContent = product.description;
                const price = document.createElement('div');
                price.className = 'product-price';
                price.innerHTML = product.price + ' <small>FCFA</small>';
                const orderBtn = document.createElement('button');
                orderBtn.className = 'order-btn';
                orderBtn.innerHTML = '🛒 Commander ce pagne via WhatsApp';
                orderBtn.addEventListener('click', function() {
                    const message = 'Bonjour Afrique\u2019Art,%0A%0A' + 'Je souhaite commander le pagne suivant :%0A' + '📦 Pagne : ' + encodeURIComponent(product.name) + '%0A' + '💰 Prix : ' + encodeURIComponent(product.price) + '%0A%0A' + 'Merci de me confirmer la disponibilité.';
                    const url = 'https://api.whatsapp.com/send/?phone=' + WHATSAPP_NUMBER + '&text=' + message;
                    window.open(url, '_blank');
                });
                infoDiv.appendChild(title);
                infoDiv.appendChild(description);
                infoDiv.appendChild(price);
                infoDiv.appendChild(orderBtn);
                card.appendChild(imageDiv);
                card.appendChild(infoDiv);
                productGrid.appendChild(card);
            });
        }

        async function loadProducts() {
            try {
                const response = await fetch('https://api.jsonbin.io/v3/b/' + BIN_ID + '/latest', {
                    method: 'GET',
                    headers: { 'X-Access-Key': ACCESS_KEY }
                });
                if (!response.ok) throw new Error('Erreur API: ' + response.status);
                const data = await response.json();
                const products = data.record;
                if (Array.isArray(products) && products.length > 0) {
                    displayProducts(products);
                } else {
                    displayProducts(defaultProducts);
                }
            } catch (error) {
                console.error('Erreur de chargement :', error);
                displayProducts(defaultProducts);
            }
        }
        loadProducts();
    </script>
